<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Poster</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: white;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #1e293b;
    }
    p {
      color: #5a6874;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 60px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus {
      border-color: #ff4757;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      border: none;
      padding: 14px;
      border-radius: 60px;
      color: white;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      transform: scale(0.98);
    }
    .error {
      color: #ff4757;
      font-size: 14px;
      margin-top: 12px;
    }
    .success {
      color: #10b981;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Set new password</h1>
  <p>Create a strong password for your account</p>
  <input type="password" id="newPassword" placeholder="New password" autocomplete="off">
  <input type="password" id="confirmPassword" placeholder="Confirm password">
  <button id="resetBtn">Reset password</button>
  <div id="message" class="error"></div>
</div>

<script>
  // URL से access_token और type=recovery पकड़ें
  const urlParams = new URLSearchParams(window.location.hash.substring(1));
  const accessToken = urlParams.get('access_token');
  const type = urlParams.get('type');

  if (!accessToken || type !== 'recovery') {
    document.getElementById('message').innerText = 'Invalid or expired reset link. Please request a new one.';
    document.getElementById('resetBtn').disabled = true;
  }

  document.getElementById('resetBtn').addEventListener('click', async () => {
    const newPwd = document.getElementById('newPassword').value;
    const confirmPwd = document.getElementById('confirmPassword').value;
    const msgDiv = document.getElementById('message');

    if (!newPwd || newPwd.length < 8) {
      msgDiv.innerText = 'Password must be at least 8 characters';
      return;
    }
    if (newPwd !== confirmPwd) {
      msgDiv.innerText = 'Passwords do not match';
      return;
    }

    msgDiv.innerText = '';
    msgDiv.classList.remove('success', 'error');

    try {
      const response = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: accessToken, newPassword: newPwd })
      });
      const data = await response.json();
      if (data.success) {
        msgDiv.classList.add('success');
        msgDiv.innerText = 'Password reset successfully! You can now login.';
        document.getElementById('resetBtn').disabled = true;
        setTimeout(() => { window.location.href = '/'; }, 2000);
      } else {
        msgDiv.innerText = data.message || 'Failed to reset password. Try again.';
      }
    } catch (err) {
      msgDiv.innerText = 'Server error. Please try later.';
    }
  });
</script>
</body>
</html>
